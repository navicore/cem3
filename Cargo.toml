[workspace]
members = ["crates/core", "crates/runtime", "crates/compiler", "crates/lsp", "crates/repl", "crates/vim-line"]
resolver = "2"

[workspace.package]
version = "7.7.0"
edition = "2024"
authors = ["Ed Sweeney <ed@onextent.com>"]
license = "MIT"
documentation = "https://docs.navicore.tech/patch-seq/"
repository = "https://git.navicore.tech/navicore/patch-seq"

[workspace.dependencies]
# Concurrency
may = { version = "0.3", features = ["rand_work_steal"] }
tokio = { version = "1", features = ["full"] }

# Memory management
bumpalo = "3.16"

# System calls
libc = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
# bincode 3.0.0 on crates.io is a `compile_error!` placeholder
# (xkcd 2347 reference, not a real release). 2.0.1 is the actual
# current line — the API change from 1.x to 2.x is the encode_to_vec /
# decode_from_slice migration plus typed EncodeError / DecodeError.
bincode = { version = "2.0", features = ["serde"] }
toml = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
rustyline = "18"
home = "0.5"

# File watching
notify = "8"

# LSP
tower-lsp = "0.20"
lsp-types = "0.97"

# TUI
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Signal handling (Unix)
signal-hook = "0.4"

# Testing
tempfile = "3"
serial_test = "3"

# Encoding
base64 = "0.22"
hex = "0.4"

# Crypto
sha2 = "0.11"
hmac = "0.13"
rand = "0.10"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }  # 0.6 to match ed25519-dalek 2.x; provides OsRng
uuid = { version = "1.11", features = ["v4"] }
subtle = "2.6"  # Constant-time comparison
aes-gcm = "0.11"  # AES-256-GCM authenticated encryption
pbkdf2 = "0.13"   # Password-based key derivation
ed25519-dalek = { version = "2.1", features = ["rand_core"] }  # Ed25519 digital signatures

# URL parsing — used by the SSRF validator in net.http.* and by future
# URL-handling layers. (The HTTP client itself is now hand-rolled over
# TCP/TLS — see runtime/src/http_client/.)
url = "2.5"

# TLS — used by net.tls.client and (eventually) the may-aware HTTP rewrite.
# Pinned to the same major as ureq's transitive rustls so the build doesn't
# end up with two copies. Default features pull aws_lc_rs *in addition to*
# ring (which ureq enables), so we disable defaults and pick only the
# crypto provider that's already being built.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0"

# Regular expressions
regex = "1.11"

# Compression
flate2 = "1.0"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
