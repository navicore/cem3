[book]
title = "Seq Programming Language"
authors = ["navicore"]
description = "Documentation for Seq, a concatenative stack-based programming language"
src = "docs"
language = "en"

[build]
build-dir = "book"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://git.navicore.tech/navicore/patch-seq"
edit-url-template = "https://git.navicore.tech/navicore/patch-seq/_edit/main/docs/{path}"
site-url = "/patch-seq/"
additional-js = ["mdbook-assets/mermaid.min.js", "mdbook-assets/mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
boost-hierarchy = 2

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
