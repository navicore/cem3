name: Daily Benchmarks

on:
  schedule:
    # Run daily at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      # Install `just` from a pinned GitHub release tarball. We avoid both
      # `extractions/setup-just` and the `just.systems/install.sh` script
      # because both query api.github.com to discover the latest version.
      # On Forgejo Actions, GITHUB_TOKEN is a Forgejo token; sending it to
      # GitHub yields a 401 / "Bad credentials". Downloading a pinned
      # release artifact directly bypasses the API entirely and gives us
      # reproducible CI as a bonus. Bump JUST_VERSION to upgrade.
      - name: Install just
        env:
          JUST_VERSION: 1.42.4
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Install Go from a pinned go.dev tarball. `actions/setup-go`
      # resolves versions through GitHub's `actions/go-versions` manifest
      # (same GitHub-only API path that broke the `just` install above),
      # which Forgejo Actions can't reach — its GITHUB_TOKEN is a
      # Forgejo token. `go.dev/dl` serves binaries directly with no API.
      # Bump GO_VERSION to upgrade.
      - name: Install Go
        env:
          GO_VERSION: 1.21.13
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" \
            | tar -xz -C "$HOME"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # Python: rely on the system `python3` shipped with `ubuntu-latest`.
      # `actions/setup-python` resolves versions through GitHub's
      # python-versions manifest (same GitHub-only API path that broke
      # the `just` install above), which Forgejo Actions can't reach
      # — its GITHUB_TOKEN is a Forgejo token. The bench script already
      # `command -v python3`-checks and skips Python suites if missing.

      - name: Run benchmarks
        run: just bench

      - name: Check for regressions
        run: ./scripts/check-bench-regression.sh

      # Pinned to @v3 because @v4+ uses the artifact v2.0 backend API
      # which Forgejo doesn't implement — the action errors with
      # `GHESNotSupportedError`. v3 uses the older REST-shaped API that
      # Forgejo Actions does implement. Do NOT bump this without first
      # confirming Forgejo has added v2.0 backend support.
      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results-${{ github.run_number }}
          path: benchmarks/results/

