name: CI - Linux

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# This workflow ONLY calls `just` commands. The justfile is the source
# of truth for all build/test/lint logic, preventing drift between
# local development and CI.

jobs:
  ci-linux:
    name: CI - Linux x86_64
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain (edition 2024)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.95.0  # Pin exact version to match local development
        components: rustfmt, clippy

    - name: Verify Rust version
      run: rustc --version && cargo --version && cargo clippy --version

    - name: Install system dependencies
      run: |
        # The default `clang` on Debian bookworm is version 14, but seqc
        # generates LLVM IR with opaque pointers and requires clang/LLVM 15+.
        # Install clang-16 explicitly and point the unversioned `clang`
        # command at it via update-alternatives, since the seqc compiler
        # invokes plain `clang` (see crates/compiler/src/lib.rs).
        apt-get update
        apt-get install -y libedit-dev clang-15
        update-alternatives --install /usr/bin/clang clang /usr/bin/clang-15 100
        clang --version

    # Install `just` from a pinned GitHub release tarball. We avoid both
    # `extractions/setup-just` and the `just.systems/install.sh` script
    # because both query api.github.com to discover the latest version.
    # On Forgejo Actions, GITHUB_TOKEN is a Forgejo token; sending it to
    # GitHub yields a 401 / "Bad credentials". Downloading a pinned
    # release artifact directly bypasses the API entirely and gives us
    # reproducible CI as a bonus. Bump JUST_VERSION to upgrade.
    - name: Install just
      env:
        JUST_VERSION: 1.42.4
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        curl --proto '=https' --tlsv1.2 -sSfL \
          "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" just
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: linux-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: linux-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    # NOTE: We intentionally do NOT cache target/ because compiled tests
    # contain language semantics. When builtins change (e.g., add -> i.add),
    # stale cached test binaries cause false failures.

    - name: Run CI checks (just ci)
      run: just ci

    - name: Verify critical design tests
      run: just test-critical
