name: Calibrate Benchmark Baseline

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      # Install `just` from a pinned GitHub release tarball. We avoid both
      # `extractions/setup-just` and the `just.systems/install.sh` script
      # because both query api.github.com to discover the latest version.
      # On Forgejo Actions, GITHUB_TOKEN is a Forgejo token; sending it to
      # GitHub yields a 401 / "Bad credentials". Downloading a pinned
      # release artifact directly bypasses the API entirely and gives us
      # reproducible CI as a bonus. Bump JUST_VERSION to upgrade.
      - name: Install just
        env:
          JUST_VERSION: 1.42.4
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run benchmarks
        run: just bench

      - name: Update baseline
        run: cp benchmarks/results/*_seq.txt benchmarks/baseline/

      - name: Show new baseline
        run: |
          echo "New baseline values:"
          echo ""
          for f in benchmarks/baseline/*_seq.txt; do
            echo "=== $(basename "$f") ==="
            cat "$f"
            echo ""
          done

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ github.run_number }}
          path: benchmarks/baseline/

      - name: Commit updated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/baseline/
          git diff --cached --quiet || git commit -m "Update benchmark baseline from CI calibration"
          git push
