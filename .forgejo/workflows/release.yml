name: Release with Auto Version

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Auto-version and Publish
    runs-on: navicore-rust
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}
          ref: main

      # The `navicore-rust` runner image ships Rust 1.95.0 + clippy/rustfmt
      # plus the system libs seqc/seq-lsp/seq-repl link against (libedit-dev,
      # libssl-dev) pre-installed. Do NOT add a dtolnay/rust-toolchain step
      # or apt-get install — act mirrors third-party actions from
      # data.forgejo.org, which does not host dtolnay/rust-toolchain, and the
      # system deps are already in the image. See navicore-forgejo-runner
      # repo for the image definition.
      - name: Verify toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          clang --version

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update version in workspace Cargo.toml
        run: |
          CURRENT_VERSION=$(grep -A5 '\[workspace.package\]' Cargo.toml | grep '^version' | cut -d'"' -f2)

          if [ "$CURRENT_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            # Update version in [workspace.package] section only
            # Uses awk to find the section and update the first version line within it
            awk -v new_version="${{ steps.version.outputs.version }}" '
              /^\[workspace\.package\]/ { in_section=1 }
              /^\[/ && !/^\[workspace\.package\]/ { in_section=0 }
              in_section && /^version = / {
                print "version = \"" new_version "\""
                in_section=0
                next
              }
              { print }
            ' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml

            # Update seq-runtime build dependency version in crates/compiler/Cargo.toml
            # This ensures the compiler pins to the exact runtime version
            awk -v new_version="${{ steps.version.outputs.version }}" '
              /seq-runtime = \{ path = "\.\.\/runtime", version = "=/ {
                sub(/version = "=[^"]*"/, "version = \"=" new_version "\"")
              }
              { print }
            ' crates/compiler/Cargo.toml > crates/compiler/Cargo.toml.tmp && mv crates/compiler/Cargo.toml.tmp crates/compiler/Cargo.toml

            # Update seq-compiler dependency version in crates/lsp/Cargo.toml
            # This ensures the LSP pins to the exact compiler version
            awk -v new_version="${{ steps.version.outputs.version }}" '
              /^seq-compiler = \{ path = "\.\.\/compiler"/ {
                sub(/version = "=[^"]*"/, "version = \"=" new_version "\"")
              }
              { print }
            ' crates/lsp/Cargo.toml > crates/lsp/Cargo.toml.tmp && mv crates/lsp/Cargo.toml.tmp crates/lsp/Cargo.toml

            # Update seq-compiler dependency version in crates/repl/Cargo.toml
            # This ensures the REPL pins to the exact compiler version
            awk -v new_version="${{ steps.version.outputs.version }}" '
              /^seq-compiler = \{ path = "\.\.\/compiler"/ {
                sub(/version = "=[^"]*"/, "version = \"=" new_version "\"")
              }
              { print }
            ' crates/repl/Cargo.toml > crates/repl/Cargo.toml.tmp && mv crates/repl/Cargo.toml.tmp crates/repl/Cargo.toml

            # Update vim-line dependency version in crates/repl/Cargo.toml
            # This ensures the REPL pins to the exact vim-line version
            awk -v new_version="${{ steps.version.outputs.version }}" '
              /^vim-line = \{ path = "\.\.\/vim-line"/ {
                sub(/version = "=[^"]*"/, "version = \"=" new_version "\"")
              }
              { print }
            ' crates/repl/Cargo.toml > crates/repl/Cargo.toml.tmp && mv crates/repl/Cargo.toml.tmp crates/repl/Cargo.toml

            # Update seq-core dependency version in crates/runtime/Cargo.toml
            # This ensures the runtime pins to the exact core version
            awk -v new_version="${{ steps.version.outputs.version }}" '
              /^seq-core = \{ path = "\.\.\/core"/ {
                sub(/version = "=[^"]*"/, "version = \"=" new_version "\"")
              }
              { print }
            ' crates/runtime/Cargo.toml > crates/runtime/Cargo.toml.tmp && mv crates/runtime/Cargo.toml.tmp crates/runtime/Cargo.toml

            cargo generate-lockfile

            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"

            git add Cargo.toml crates/compiler/Cargo.toml crates/lsp/Cargo.toml crates/repl/Cargo.toml crates/runtime/Cargo.toml crates/vim-line/Cargo.toml Cargo.lock
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
            git push origin HEAD:main

            echo "Version updated and pushed"
          else
            echo "Version already matches tag, skipping update"
          fi

      - name: Run tests
        run: cargo test --workspace

      - name: Verify all crates have matching versions
        run: |
          WORKSPACE_VERSION=$(grep -A5 '\[workspace.package\]' Cargo.toml | grep '^version' | cut -d'"' -f2)
          echo "Workspace version: $WORKSPACE_VERSION"

          # Check each crate uses workspace version
          for crate in core runtime compiler lsp repl vim-line; do
            CRATE_VERSION=$(grep -A10 '^\[package\]' crates/$crate/Cargo.toml | grep '^version' | head -1)
            if ! echo "$CRATE_VERSION" | grep -q "version.workspace = true"; then
              echo "ERROR: crates/$crate/Cargo.toml does not use workspace version!"
              exit 1
            fi
            echo "✓ $crate uses workspace version"
          done

          # Verify runtime's dependency on core has exact version match
          CORE_DEP=$(grep 'seq-core.*path.*core' crates/runtime/Cargo.toml | grep -o 'version = "[^"]*"' | cut -d'"' -f2)
          if [ "$CORE_DEP" != "=$WORKSPACE_VERSION" ]; then
            echo "ERROR: runtime's seq-core dependency version doesn't match!"
            echo "Expected: =$WORKSPACE_VERSION"
            echo "Found: $CORE_DEP"
            exit 1
          fi
          echo "✓ runtime seq-core dependency pinned to exact version: $CORE_DEP"

          # Verify compiler's build dependency on runtime has exact version match
          RUNTIME_DEP=$(grep 'seq-runtime.*path.*runtime' crates/compiler/Cargo.toml | grep -o 'version = "[^"]*"' | cut -d'"' -f2)
          if [ "$RUNTIME_DEP" != "=$WORKSPACE_VERSION" ]; then
            echo "ERROR: compiler's seq-runtime build dependency version doesn't match!"
            echo "Expected: =$WORKSPACE_VERSION"
            echo "Found: $RUNTIME_DEP"
            exit 1
          fi
          echo "✓ compiler build dependency pinned to exact version: $RUNTIME_DEP"

          # Verify lsp's dependency on compiler has exact version match
          COMPILER_DEP=$(grep 'seq-compiler.*path.*compiler' crates/lsp/Cargo.toml | grep -o 'version = "[^"]*"' | cut -d'"' -f2)
          if [ "$COMPILER_DEP" != "=$WORKSPACE_VERSION" ]; then
            echo "ERROR: lsp's seq-compiler dependency version doesn't match!"
            echo "Expected: =$WORKSPACE_VERSION"
            echo "Found: $COMPILER_DEP"
            exit 1
          fi
          echo "✓ lsp dependency pinned to exact version: $COMPILER_DEP"

          # Verify repl's dependency on compiler has exact version match
          REPL_DEP=$(grep 'seq-compiler.*path.*compiler' crates/repl/Cargo.toml | grep -o 'version = "[^"]*"' | cut -d'"' -f2)
          if [ "$REPL_DEP" != "=$WORKSPACE_VERSION" ]; then
            echo "ERROR: repl's seq-compiler dependency version doesn't match!"
            echo "Expected: =$WORKSPACE_VERSION"
            echo "Found: $REPL_DEP"
            exit 1
          fi
          echo "✓ repl seq-compiler dependency pinned to exact version: $REPL_DEP"

          # Verify repl's dependency on vim-line has exact version match
          VIMLINE_DEP=$(grep 'vim-line.*path.*vim-line' crates/repl/Cargo.toml | grep -o 'version = "[^"]*"' | cut -d'"' -f2)
          if [ "$VIMLINE_DEP" != "=$WORKSPACE_VERSION" ]; then
            echo "ERROR: repl's vim-line dependency version doesn't match!"
            echo "Expected: =$WORKSPACE_VERSION"
            echo "Found: $VIMLINE_DEP"
            exit 1
          fi
          echo "✓ repl vim-line dependency pinned to exact version: $VIMLINE_DEP"

          echo "✓ All version checks passed!"

      - name: Publish seq-core to crates.io
        run: cargo publish -p seq-core --no-verify --token ${{ secrets.CRATES_IO_TOKEN }} 2>&1 || echo "::warning::seq-core publish failed (may already exist)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for crates.io to index seq-core
        run: sleep 120

      - name: Publish seq-runtime to crates.io
        run: cargo publish -p seq-runtime --no-verify --token ${{ secrets.CRATES_IO_TOKEN }} 2>&1 || echo "::warning::seq-runtime publish failed (may already exist)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for crates.io to index seq-runtime
        run: sleep 120

      - name: Build runtime for embedding
        run: cargo build --release -p seq-runtime

      - name: Publish seq-compiler to crates.io
        run: cargo publish -p seq-compiler --no-verify --token ${{ secrets.CRATES_IO_TOKEN }} 2>&1 || echo "::warning::seq-compiler publish failed (may already exist)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for crates.io to index seq-compiler
        run: sleep 120

      - name: Publish seq-lsp to crates.io
        run: cargo publish -p seq-lsp --no-verify --token ${{ secrets.CRATES_IO_TOKEN }} 2>&1 || echo "::warning::seq-lsp publish failed (may already exist)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish vim-line to crates.io
        run: cargo publish -p vim-line --no-verify --token ${{ secrets.CRATES_IO_TOKEN }} 2>&1 || echo "::warning::vim-line publish failed (may already exist)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for crates.io to index vim-line
        run: sleep 120

      - name: Publish seq-repl to crates.io
        run: cargo publish -p seq-repl --no-verify --token ${{ secrets.CRATES_IO_TOKEN }} 2>&1 || echo "::warning::seq-repl publish failed (may already exist)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
