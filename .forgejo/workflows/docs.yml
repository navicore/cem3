name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build the mdBook docs and publish them to docs.navicore.tech/patch-seq via
# navidocs. Auth is a short-lived anz client_credentials token (no deploy key).
#
# runs-on: navicore-rust — the custom runner image (Rust 1.95.0 + just
# pre-installed). See ../navicore-forgejo-runner for the image definition.
#
# Required repo secrets: DOCS_CLIENT_ID, DOCS_CLIENT_SECRET (the anz service
# account registered for this repo). The slug below must match what navidocs'
# policy allows that client to publish.

jobs:
  publish-docs:
    name: Build and publish docs
    runs-on: navicore-rust
    steps:
      - uses: actions/checkout@v6

      # mdbook / mdbook-mermaid aren't in the runner image; cache the installed
      # binaries so this is a no-op on subsequent runs.
      - name: Cache mdBook tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-mermaid
          key: navicore-rust-mdbook-tools-v1

      - name: Install mdBook
        run: cargo install --locked mdbook mdbook-mermaid

      - name: Build docs
        run: just docs # gen-docs + mdbook build -> ./book

      - name: Publish to docs.navicore.tech/patch-seq
        env:
          ANZ_TOKEN_URL: https://auth.navicore.tech/realms/homelab/token
          DOCS_CLIENT_ID: ${{ secrets.DOCS_CLIENT_ID }}
          DOCS_CLIENT_SECRET: ${{ secrets.DOCS_CLIENT_SECRET }}
          DOCS_BASE_URL: https://docs.navicore.tech
          SLUG: patch-seq
        run: |
          set -euo pipefail
          # client_credentials token from anz, kept in a shell var so it never
          # lands in the logs. Parsed without jq (not guaranteed on the runner).
          TOKEN=$(curl -sf -X POST "$ANZ_TOKEN_URL" \
            -d grant_type=client_credentials \
            -d client_id="$DOCS_CLIENT_ID" \
            -d client_secret="$DOCS_CLIENT_SECRET" \
            -d scope=docs:publish \
            | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$TOKEN" ]; then
            echo "::error::failed to obtain an access token from anz"
            exit 1
          fi
          # Stream the built book as a gzipped tar to navidocs.
          tar czf - -C book . | curl -sf -X POST \
            "$DOCS_BASE_URL/api/sites/$SLUG" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/gzip" \
            --data-binary @-
          echo "Published to $DOCS_BASE_URL/$SLUG/"
